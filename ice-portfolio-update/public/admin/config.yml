# Decap CMS: edits the files in /content and uploads images to /public/uploads.
# Each "Publish" commits to GitHub, and GitHub Actions rebuilds the site on GitHub Pages (about 2-3 minutes).
# Login uses the GitHub OAuth app already registered on the Netlify site (site_domain), so it works from GitHub Pages.
# Paths start with ice-portfolio-update/ because the site lives in that folder of the repository.
backend:
  name: github
  repo: ICXd162/ice-portfolio
  branch: main
  base_url: https://api.netlify.com
  site_domain: resplendent-daffodil-6cb7b2.netlify.app
  commit_messages:
    update: "อัปเดต {{slug}}"
    uploadMedia: "อัปโหลด {{path}}"
    deleteMedia: "ลบ {{path}}"

locale: th
media_folder: ice-portfolio-update/public/uploads
public_folder: /uploads
site_url: https://icxd162.github.io/ice-portfolio
display_url: https://icxd162.github.io/ice-portfolio

collections:
  - name: sections
    label: ส่วนต่างๆ ของเว็บ
    files:
      - name: site
        label: "1. หน้าแรก และ เกี่ยวกับฉัน"
        file: ice-portfolio-update/content/site.json
        fields:
          - { name: name, label: ชื่อที่แสดง, widget: string }
          - { name: accent, label: สีหลักของเว็บ (ปุ่ม หัวข้อ ไฮไลต์), widget: color, default: "#ff3f1e" }
          - name: sections
            label: ลำดับส่วนต่างๆ ของหน้าเว็บ (ลากเพื่อเรียง / ปิดสวิตช์เพื่อซ่อน)
            label_singular: ส่วน
            widget: list
            collapsed: true
            summary: "{{fields.section}} | {{fields.visible | ternary('แสดงอยู่', 'ซ่อนอยู่')}}"
            hint: "หน้าแรก (Hero) อยู่บนสุดเสมอ ถ้า About อยู่ลำดับแรก จะมีเอฟเฟกต์เลื่อนทับหน้าแรก"
            fields:
              - { name: section, label: ส่วน, widget: select, options: ["เกี่ยวกับฉัน", "งานวิดีโอ", "งานกราฟิก", "ขั้นตอนการทำงาน", "ตัวเลขผลงาน", "บริการ", "รีวิวลูกค้า", "แพ็กเกจราคา", "ติดต่อ", "คำถามที่พบบ่อย"] }
              - { name: visible, label: แสดงบนเว็บ, widget: boolean, default: true }
          - { name: headline, label: หัวข้อใหญ่, widget: string, hint: "สั้นๆ ไม่เกิน 6 คำ จะได้ไม่เกิน 2 บรรทัด" }
          - { name: subtext, label: คำอธิบายใต้หัวข้อ (ไม่ใส่ก็ได้ ตัวอย่างต้นแบบไม่มี), widget: text, required: false }
          - { name: heroImage, label: รูปหน้าคุณตรงกลาง, widget: imagecrop, aspect: "4/5", hint: "ดีที่สุดคือไฟล์ PNG ตัดพื้นหลังออก (เช่นจาก remove.bg) ขนาดอย่างน้อย 1400 px ระบบจะไล่ขอบให้กลืนกับพื้นสีส้มเอง" }
          - name: heroSlides
            label: ผลงานสไลด์ด้านขวา (เลื่อนขึ้นอัตโนมัติ) ลากเพื่อเรียงลำดับ
            label_singular: สไลด์
            widget: list
            collapsed: true
            summary: "{{fields.image}}"
            hint: "แนะนำ 4-8 รูป ภาพสี่เหลี่ยมจัตุรัสจะสวยที่สุด"
            fields:
              - { name: image, label: รูป หรือวิดีโอสั้น .mp4 (สี่เหลี่ยมจัตุรัส), widget: imagecrop, aspect: "1/1", hint: "ภาพเคลื่อนไหวให้ใช้ .mp4 แทน GIF (GIF ไฟล์ใหญ่มาก) ทุกไฟล์ต้องไม่เกิน 20MB ไม่งั้นจะกดเผยแพร่ไม่ผ่าน" }
              - { name: link, label: ลิงก์เมื่อกดรูป (ไม่ใส่ก็ได้), widget: string, required: false }
          - { name: clientsLabel, label: ข้อความหน้าโลโก้ลูกค้า, widget: string, required: false }
          - name: clients
            label: โลโก้ลูกค้าที่เคยร่วมงาน (เลื่อนซ้ายอัตโนมัติ ลบหมด = ซ่อน)
            label_singular: โลโก้
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: ชื่อแบรนด์, widget: string }
              - { name: logo, label: ไฟล์โลโก้ (PNG พื้นใส หรือ SVG จะแสดงเป็นสีขาว), widget: image, choose_url: true }
          - { name: aboutLabel, label: หัวข้อส่วนเกี่ยวกับฉัน, widget: string }
          - { name: about, label: แนะนำตัว, widget: text }
          - { name: thaiName, label: ชื่อภาษาไทย, widget: string, required: false }
          - { name: showreelImage, label: ภาพปก Showreel, widget: imagecrop, aspect: "16/9", required: false }
          - { name: showreelUrl, label: ลิงก์ Showreel (YouTube / Vimeo / Drive), widget: string, required: false }

      - name: videos
        label: "2. งานวิดีโอ"
        file: ice-portfolio-update/content/videos.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - name: items
            label: วิดีโอ ลากเพื่อเรียงลำดับ (แยกแท็บตามประเภทให้อัตโนมัติ)
            label_singular: วิดีโอ
            widget: list
            collapsed: true
            summary: "{{fields.type}} | {{fields.group}} | {{fields.title}}"
            fields:
              - { name: title, label: ชื่องาน, widget: string }
              - { name: client, label: ลูกค้า / ช่อง, widget: string, required: false }
              - { name: type, label: ประเภท, widget: select, default: "Long form", options: ["Short form", "Long form", "Motion graphics"], hint: "Short form แสดงเป็นกรอบแนวตั้ง 9:16 ที่เหลือเป็นแนวนอน 16:9" }
              - { name: group, label: หมวดย่อย (ปุ่มกรองใน Short form), widget: string, required: false, hint: "เช่น Games, Talking head, Vlog & travel, Knowledge — ใช้ชื่อเดียวกันจะอยู่หมวดเดียวกัน" }
              - { name: file, label: ไฟล์วิดีโอ (อัปโหลดขึ้นเว็บ), widget: file, required: false, media_folder: /ice-portfolio-update/public/uploads/videos, public_folder: /uploads/videos, hint: "ไฟล์ .mp4 ไม่เกิน 25MB (แนะนำ 720p) เล่นในหน้าเว็บได้เลย ถ้าใส่ไฟล์แล้วไม่ต้องใส่ลิงก์" }
              - { name: videoUrl, label: ลิงก์วิดีโอ, widget: string, required: false, hint: "ลิงก์ YouTube (รวม Shorts) จะเล่นในหน้าเว็บได้เลยและดึงภาพปกให้เอง ลิงก์อื่นเช่น TikTok / Drive จะเปิดแท็บใหม่" }
              - { name: cover, label: ภาพปก (ไม่ใส่ได้ถ้าเป็น YouTube), widget: imagecrop, aspect: "16/9", required: false }
              - { name: featured, label: "ไฮไลต์ (Short form: ขึ้นแถว Highlights บนสุด / แบบอื่น: การ์ดใหญ่)", widget: boolean, default: false, required: false }

      - name: designs
        label: "3. งานกราฟิก"
        file: ice-portfolio-update/content/designs.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - name: items
            label: ผลงาน ลากเพื่อเรียงลำดับ
            label_singular: ผลงาน
            widget: list
            collapsed: true
            summary: "{{fields.type}} | {{fields.title}}"
            fields:
              - { name: title, label: ชื่องาน, widget: string }
              - { name: client, label: ลูกค้า, widget: string, required: false }
              - { name: type, label: ประเภท (ใช้เป็นปุ่มกรอง), widget: select, default: "Banner", options: ["Banner", "Thumbnail", "Social post", "Poster & print", "Other"] }
              - { name: image, label: ภาพผลงาน, widget: imagecrop, aspect: "4/5" }
              - { name: frame, label: กรอบที่แสดงบนเว็บ, widget: select, default: original, options: [{ label: "ขนาดจริง (ไม่ครอป)", value: original }, { label: "สี่เหลี่ยมจัตุรัส 1:1", value: square }, { label: "แนวตั้ง 4:5", value: portrait }, { label: "แนวนอน 16:9", value: landscape }, { label: "แบนเนอร์ยาว 3:1", value: banner }], hint: "ถ้าเลือกกรอบ ระบบจะใช้ตำแหน่งครอปที่ตั้งไว้ด้านบน" }
              - { name: link, label: ลิงก์เพิ่มเติม เช่น Behance (ไม่ใส่ก็ได้), widget: string, required: false }

      - name: process
        label: "4. ขั้นตอนการทำงาน"
        file: ice-portfolio-update/content/process.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - name: steps
            label: ขั้นตอน ลากเพื่อเรียงลำดับ
            label_singular: ขั้นตอน
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: ชื่อขั้นตอน, widget: string }
              - { name: body, label: คำอธิบาย, widget: text }
              - { name: image, label: รูป, widget: imagecrop, aspect: "16/10", required: false }

      - name: stats
        label: "5. ตัวเลขผลงาน (ไม่ใส่ = ซ่อน)"
        file: ice-portfolio-update/content/stats.json
        fields:
          - { name: heading, label: หัวข้อเล็ก, widget: string, required: false }
          - name: items
            label: ตัวเลข (แนะนำ 4 ช่อง)
            label_singular: ตัวเลข
            widget: list
            required: false
            summary: "{{fields.value}}{{fields.suffix}} {{fields.label}}"
            fields:
              - { name: value, label: ตัวเลข, widget: number, value_type: int }
              - { name: suffix, label: ต่อท้าย เช่น + หรือ %, widget: string, required: false }
              - { name: label, label: คำอธิบาย เช่น โปรเจกต์ที่ทำ, widget: string }

      - name: services
        label: "6. บริการ"
        file: ice-portfolio-update/content/services.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - { name: videoLabel, label: ชื่อแท็บวิดีโอ, widget: string, default: Video }
          - { name: designLabel, label: ชื่อแท็บกราฟิก, widget: string, default: Graphic design }
          - name: items
            label: บริการ ลากเพื่อเรียงลำดับ (ในแต่ละแท็บ 2 อันแรกได้การ์ดใหญ่ / สลับแท็บอัตโนมัติทุก 10 วิ)
            label_singular: บริการ
            widget: list
            collapsed: true
            summary: "{{fields.category}} · {{fields.title}}"
            fields:
              - { name: category, label: แท็บ, widget: select, default: video, options: [{ label: "วิดีโอ", value: video }, { label: "กราฟิก", value: design }] }
              - { name: title, label: ชื่อบริการ, widget: string }
              - { name: body, label: คำอธิบาย, widget: text }
              - { name: image, label: รูป, widget: imagecrop, aspect: "16/10", required: false }
          - { name: beforeAfterTitle, label: หัวข้อภาพเทียบก่อน/หลัง, widget: string, required: false }
          - { name: beforeImage, label: ภาพก่อนแก้สี (ใส่ทั้งสองภาพจึงจะแสดง), widget: imagecrop, aspect: "16/9", required: false }
          - { name: afterImage, label: ภาพหลังแก้สี, widget: imagecrop, aspect: "16/9", required: false }

      - name: testimonials
        label: "7. รีวิวจากลูกค้า (ไม่ใส่ = ซ่อน)"
        file: ice-portfolio-update/content/testimonials.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - name: items
            label: รีวิว (ใส่เฉพาะรีวิวจริงที่ลูกค้าอนุญาต)
            label_singular: รีวิว
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { name: quote, label: ข้อความรีวิว (สั้นๆ 1-3 บรรทัด), widget: text }
              - { name: name, label: ชื่อลูกค้า, widget: string }
              - { name: role, label: ตำแหน่ง / บริษัท / ช่อง, widget: string, required: false }
              - { name: photo, label: รูปลูกค้า, widget: imagecrop, aspect: "1/1", required: false }

      - name: pricing
        label: "8. แพ็กเกจราคา (ไม่ใส่ = ซ่อน)"
        file: ice-portfolio-update/content/pricing.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - name: plans
            label: แพ็กเกจ
            label_singular: แพ็กเกจ
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.name}} {{fields.price}}"
            fields:
              - { name: name, label: ชื่อแพ็กเกจ, widget: string }
              - { name: description, label: คำอธิบายสั้นๆ, widget: string, required: false }
              - { name: price, label: ราคา เช่น ฿3,500, widget: string }
              - { name: period, label: ต่อ เช่น คลิป หรือ เดือน, widget: string, required: false }
              - { name: features, label: สิ่งที่ได้, label_singular: รายการ, widget: list, field: { name: feature, label: รายการ, widget: string } }
              - { name: highlighted, label: เน้นเป็นแพ็กเกจแนะนำ (การ์ดสีส้ม), widget: boolean, default: false }

      - name: contact
        label: "9. ติดต่อ"
        file: ice-portfolio-update/content/contact.json
        fields:
          - { name: heading, label: หัวข้อ, widget: string }
          - { name: intro, label: คำอธิบาย, widget: text, required: false }
          - { name: email, label: อีเมล, widget: string }
          - { name: phone, label: เบอร์โทร, widget: string, required: false }
          - { name: line, label: LINE ID, widget: string, required: false }
          - { name: instagram, label: ลิงก์ Instagram, widget: string, required: false }
          - { name: facebook, label: ลิงก์ Facebook, widget: string, required: false }

      - name: faq
        label: "10. คำถามที่พบบ่อย (ไม่ใส่ = ซ่อน)"
        file: ice-portfolio-update/content/faq.json
        fields:
          - { name: heading, label: หัวข้อส่วน, widget: string }
          - name: items
            label: คำถาม ลากเพื่อเรียงลำดับ
            label_singular: คำถาม
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: คำถาม, widget: string }
              - { name: answer, label: คำตอบ, widget: text }
